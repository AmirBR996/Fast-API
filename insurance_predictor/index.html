<!DOCTYPE html>
<html>
<head>
    <title>Insurance Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        h2 {
            text-align: center;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Insurance Premium Predictor</h2>

    <input type="number" id="age" placeholder="Age">
    <input type="number" id="weight" placeholder="Weight (kg)">
    <input type="number" id="height" placeholder="Height (m)">
    <input type="number" id="income" placeholder="Income (LPA)">

    <select id="smoker">
        <option value="false">Non-Smoker</option>
        <option value="true">Smoker</option>
    </select>

    <input type="text" id="city" placeholder="City">

    <select id="occupation">
        <option value="student">Student</option>
        <option value="private_job">Private Job</option>
        <option value="government_job">Government Job</option>
        <option value="business_owner">Business Owner</option>
        <option value="freelancer">Freelancer</option>
        <option value="retired">Retired</option>
        <option value="unemployed">Unemployed</option>
    </select>

    <button onclick="predict()">Predict</button>

    <div id="result"></div>
</div>

<script>
async function predict() {
    const data = {
        age: parseInt(document.getElementById("age").value),
        weight: parseFloat(document.getElementById("weight").value),
        height: parseFloat(document.getElementById("height").value),
        income_lpa: parseFloat(document.getElementById("income").value),
        smoker: document.getElementById("smoker").value === "true",
        city: document.getElementById("city").value,
        occupation: document.getElementById("occupation").value
    };

    try {
        const response = await fetch("http://127.0.0.1:8000/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        document.getElementById("result").innerText =
            "Prediction: " + result.predicted_category;

    } catch (error) {
        document.getElementById("result").innerText =
            "Error connecting to API";
    }
}
</script>

</body>
</html>
